[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "elsevier-stream"
dynamic = ["version"]
description = "Literature searches with Elsevier's Scopus and ScienceDirect APIs, for researchers and their AI assistants."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Ziyuan Huang" }]
keywords = ["elsevier", "scopus", "sciencedirect", "literature", "biomedical", "research", "mcp", "citations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
elsevier-stream = "elsevier_stream.cli:main"

[project.urls]
Repository = "https://github.com/melhzy/elsevier-stream"
Homepage = "https://github.com/melhzy/elsevier-stream"
"Bug Tracker" = "https://github.com/melhzy/elsevier-stream/issues"

[tool.setuptools.dynamic]
version = {attr = "elsevier_stream.__version__"}

[tool.setuptools.packages.find]
include = ["elsevier_stream*"]

[tool.setuptools.package-data]
elsevier_stream = ["py.typed", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
